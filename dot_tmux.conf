# ------------------------------------------------------------------------------
# tmux.conf
# Custom tmux configuration with version tracking and usability enhancements
# ------------------------------------------------------------------------------

# ,============================================================================================,
# |                    Tmux Keybindings and Commands Reference                                 |
# |============================================================================================|
# | Keybinding               | Action Description                                              |
# |--------------------------|-----------------------------------------------------------------|
# | prefix + |               | Split current pane horizontally                                 |
# | prefix + _               | Split current pane vertically                                   |
# | prefix + -               | Alternate vertical split                                        |
# | prefix + J               | Resize current pane down by 5 cells                             |
# | prefix + K               | Resize current pane up by 5 cells                               |
# | prefix + H               | Resize current pane left by 5 cells                             |
# | prefix + L               | Resize current pane right by 5 cells                            |
# | prefix + Alt + j         | Resize current pane down continuously                           |
# | prefix + Alt + k         | Resize current pane up continuously                             |
# | prefix + Alt + h         | Resize current pane left continuously                           |
# | prefix + Alt + l         | Resize current pane right continuously                          |
# | prefix + h               | Move to left pane                                               |
# | prefix + j               | Move to pane below                                              |
# | prefix + k               | Move to pane above                                              |
# | prefix + l               | Move to right pane                                              |
# | Alt + h                  | Move to left pane (no prefix)                                   |
# | Alt + j                  | Move to pane below (no prefix)                                  |
# | Alt + k                  | Move to pane above (no prefix)                                  |
# | Alt + l                  | Move to right pane (no prefix)                                  |
# | Alt + Left Arrow         | Move to left pane (no prefix)                                   |
# | Alt + Right Arrow        | Move to right pane (no prefix)                                  |
# | Alt + Up Arrow           | Move to pane above (no prefix)                                  |
# | Alt + Down Arrow         | Move to pane below (no prefix)                                  |
# | Shift + Left Arrow       | Switch to previous window                                       |
# | Shift + Right Arrow      | Switch to next window                                           |
# | prefix + r               | Reload tmux config and show reload confirmation                 |
# | prefix + m               | Toggle mouse mode on/off                                        |
# | Mouse Wheel Up           | Scroll up / enter copy mode                                     |
# | Mouse Wheel Down         | Scroll down                                                     |
# | Ctrl + Mouse Wheel Up    | Scroll half page up in copy mode                                |
# | Ctrl + Mouse Wheel Down  | Scroll half page down in copy mode                              |
# | prefix + [               | Enter copy mode (non-mouse)                                    |
# | h/j/k/l (copy mode)      | Move cursor in copy mode (vim style)                           |
# | Space (copy mode)        | Start text selection                                           |
# | Move cursor (copy mode)  | Expand text selection                                          |
# | Enter (copy mode)        | Copy selection to system clipboard using xclip                 |
# | Mouse Drag (copy mode)   | Copy selection to system clipboard                             |
# | prefix + ]               | Paste copied buffer inside tmux                               |
# | prefix + v               | Show current tmux config version                                |
# | prefix + e               | Open ~/.tmux.conf in new window for editing, then reload config |
# '--------------------------------------------------------------------------------------------'

# Store version as an environment variable
set-environment -g TMUX_CONFIG_VERSION "1.0.3"

# ------------------------------------------------------------------------------
# WINDOW & PANE INDEXING
# ------------------------------------------------------------------------------

# Set global base index for windows (0 or 1)
set -g base-index 0
# Override base index for specific windows to start at 1
setw -g base-index 1
# Set base index for panes to start at 1
setw -g pane-base-index 1

# ------------------------------------------------------------------------------
# WINDOW & TITLE OPTIONS
# ------------------------------------------------------------------------------

# Disable automatic window renaming based on running commands
set-window-option -g automatic-rename off
# Disable terminal title updates
set-option -g set-titles off

# ------------------------------------------------------------------------------
# GENERAL BEHAVIOR
# ------------------------------------------------------------------------------

# Use 256-color terminal
set -g default-terminal screen-256color
# Use vi-style keybindings in status line and copy-mode
set -g status-keys vi
setw -g mode-keys vi

# Increase scrollback history limit
set -g history-limit 100000

# Disable activity monitoring (no alerts on output)
setw -g monitor-activity off

# ------------------------------------------------------------------------------
# SPLIT PANES
# ------------------------------------------------------------------------------

# Bind vertical and horizontal pane splits
bind-key | split-window -h
bind-key _ split-window -v
bind-key - split-window -v  # Alternate vertical split

# ------------------------------------------------------------------------------
# RESIZE PANES
# ------------------------------------------------------------------------------

# Resize panes by 5 cells with Shift + (H/J/K/L)
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

# Resize panes continuously with Alt + (h/j/k/l)
bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R

# ------------------------------------------------------------------------------
# NAVIGATE PANES
# ------------------------------------------------------------------------------

# Use vim-like movement (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Alt + (h/j/k/l) to switch panes without prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D 
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt + Arrow keys to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift + Arrow keys to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Bind Ctrl+Shift+Right to switch to next session
bind -n C-S-Right switch-client -n
# Bind Ctrl+Shift+Left to switch to previous session
bind -n C-S-Left switch-client -p


# ------------------------------------------------------------------------------
# MISCELLANEOUS
# ------------------------------------------------------------------------------

# Reduce delay between prefix and command
set -sg escape-time 0

# Reload tmux config with prefix+r and show confirmation message
bind r source-file ~/.tmux.conf \; display-message "✅ tmux config reloaded (#{TMUX_CONFIG_VERSION})"
# ------------------------------------------------------------------------------
# STATUS BAR
# ------------------------------------------------------------------------------

# Set status bar dimensions
set -g status-left-length 32
set -g status-right-length 150
set -g status-interval 5
set -g status-bg colour234  # Background color for status bar

# Left side: session name and window/pane index
set -g status-left '#[fg=colour16,bg=yellow] #S #[fg=colour254,bg=colour238,nobold]#[fg=colour15,bg=colour238,bold] w#I.p#P #[fg=colour238,bg=colour234,nobold]'

# Right side: date, time, hostname, and continuum plugin status
set -g status-right '#[fg=colour245] #(date +"%a") %d %b %R #[fg=colour237]#[fg=colour254,bg=red] S:#{continuum_status}m #[fg=colour16,bg=colour247] #h '

# Inactive window style
set -g window-status-format "#[fg=white,bg=colour234,bold] #I:#W#{?window_zoomed_flag,#[fg=red]* , }#[fg=colour39,bg=colour234,nobold]"

# Active window style
set -g window-status-current-format "#[fg=colour16,bg=colour39,noreverse,bold] #I:#W#{?window_zoomed_flag,#[fg=red]* , }#[fg=colour39,bg=colour234,nobold]"

# Prevent accidental exit by requiring two EOF (Ctrl-D) signals
set-environment -g 'IGNOREEOF' 2

# ------------------------------------------------------------------------------
# TOGGLE MOUSE MODE
# ------------------------------------------------------------------------------

# Use environment variables to track mouse state
setenv -g 'MOUSE_CURR' off
setenv -g 'MOUSE_NEXT' on
setenv -g 'MOUSE_NEXT_TMP' on

# Set current mouse mode
set -g mouse $MOUSE_CURR

# Toggle mouse mode with prefix + m
bind-key m run 'tmux set -g mouse $MOUSE_NEXT' \;\
               run 'tmux setenv -g "MOUSE_NEXT" $MOUSE_CURR' \;\
               run 'tmux setenv -g "MOUSE_CURR" $MOUSE_NEXT_TMP' \;\
               run 'tmux setenv -g "MOUSE_NEXT_TMP" $MOUSE_NEXT' \;\
               run 'tmux display-message "Mouse Mode: $MOUSE_CURR"'

# ------------------------------------------------------------------------------
# SCROLL & MOUSE COPY BEHAVIOR
# ------------------------------------------------------------------------------

# Enable scrolling with mouse wheel
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Ctrl + Wheel scrolls and enters copy mode
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M

# Half-page scroll in copy mode (vi and emacs)
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# Use vi keys in copy mode
setw -g mode-keys vi

# Override Enter key in copy-mode to copy selection only if xclip exists
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter run-shell "command -v xclip >/dev/null 2>&1 && tmux save-buffer - | xclip -selection clipboard || tmux display-message '❌ xclip is not installed! Please install it.'; tmux send-keys -X cancel"
#bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection c"

# Enable mouse drag to copy to clipboard
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane run-shell "if command -v xclip >/dev/null 2>&1; then tmux send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'; else tmux display-message '❌ xclip not installed!'; fi"
#bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Bind Ctrl+Shift+V to paste, not needed iguess.
#bind -n C-S-v paste-buffer

# ------------------------------------------------------------------------------
# CUSTOM COMMANDS (UTILITIES)
# ------------------------------------------------------------------------------

# Show current config version with prefix + v
bind-key v display-message "tmux config version: #{TMUX_CONFIG_VERSION}"

# Open local tmux config in a new window with prefix + V
bind-key V run-shell "tmux new-window -n 'tmux.conf' 'less ~/.tmux.conf'"

# Edit tmux config in a new window with prefix + e and reload
bind-key e new-window -n 'tmux.conf' "bash -c 'vim ~/.tmux.conf && tmux source-file ~/.tmux.conf && tmux display-message \"✅ tmux config reloaded (\$(tmux show-environment -g TMUX_CONFIG_VERSION | cut -d= -f2))\"'
